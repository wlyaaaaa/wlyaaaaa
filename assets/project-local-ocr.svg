<svg xmlns="http://www.w3.org/2000/svg" width="560" height="180" viewBox="0 0 560 180" role="img" aria-labelledby="title desc">
  <title id="title">LocalOCR</title>
  <desc id="desc">面向中文文档和截图的本地 GPU OCR 工具链。</desc>
  <!-- CUSTOMIZE: title, desc, visible name, summary, tags and decoration; keep the 560 x 180 viewBox. -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40C463"/>
      <stop offset="1" stop-color="#216E39"/>
    </linearGradient>
  </defs>
  <style>
    .card { fill: #F7FBF8; stroke: #CDEBD5; }
    .eyebrow, .arrow, .tag-text { fill: #216E39; }
    .name { fill: #17201A; }
    .summary { fill: #52605A; }
    .tag { fill: #EAF6ED; stroke: #CDEBD5; }
    .scan { fill: none; stroke: #9BE9A8; opacity: 0.52; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0F1712; stroke: #244D32; }
      .eyebrow, .arrow, .tag-text { fill: #7EE787; }
      .name { fill: #F0F6FC; }
      .summary { fill: #A8B3AB; }
      .tag { fill: #13271A; stroke: #245C35; }
      .scan { stroke: #26A641; opacity: 0.38; }
    }
  </style>
  <rect class="card" x="1" y="1" width="558" height="178" rx="20" stroke-width="2"/>
  <rect x="1" y="1" width="7" height="178" rx="3.5" fill="url(#accent)"/>
  <circle cx="30" cy="29" r="4" fill="#2DA44E"/>
  <text class="eyebrow" x="43" y="34" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.7">FEATURED / 03</text>
  <text class="arrow" x="512" y="49" font-family="'Segoe UI Symbol','Segoe UI',sans-serif" font-size="27" font-weight="600">↗</text>
  <path class="scan" d="M455 113v-13h13M515 113v-13h-13M455 151v13h13M515 151v13h-13M465 132h40" stroke-width="3" stroke-linecap="round"/>
  <text class="name" x="28" y="77" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="25" font-weight="700">LocalOCR</text>
  <text class="summary" x="28" y="108" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16">中文文档与截图 · 本地 GPU OCR</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600">
    <rect class="tag" x="28" y="130" width="56" height="28" rx="14"/>
    <text class="tag-text" x="44" y="149">OCR</text>
    <rect class="tag" x="92" y="130" width="72" height="28" rx="14"/>
    <text class="tag-text" x="109" y="149">Python</text>
    <rect class="tag" x="172" y="130" width="94" height="28" rx="14"/>
    <text class="tag-text" x="188" y="149">Local AI</text>
  </g>
