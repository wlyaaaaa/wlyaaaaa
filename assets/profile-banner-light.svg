  <text x="77" y="61" fill="#216E39" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.6">WLYAAAAA / PROFILE</text>

  <text x="58" y="164" fill="#17201A" font-family="'Segoe UI','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="76" font-weight="720" letter-spacing="2">吴乐阳</text>
  <text x="62" y="209" fill="#57635A" font-family="'Segoe UI','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="23">2001年08月29日</text>

