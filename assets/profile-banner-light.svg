<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">吴乐阳的 GitHub 个人主页横幅</title>
  <desc id="desc">吴乐阳的 GitHub 个人主页：写点代码，做点工具，也折腾 AI；右侧为缓慢呼吸的绿色图形。</desc>
  <defs>
    <linearGradient id="career" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#216E39"/>
      <stop offset="1" stop-color="#2DA44E"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BE9A8"/>
      <stop offset="0.55" stop-color="#40C463"/>
      <stop offset="1" stop-color="#216E39"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9BE9A8" stop-opacity="0.36"/>
      <stop offset="0.58" stop-color="#DDF7E4" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#DDE7E0" stroke-width="1" opacity="0.68"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="338" rx="28"/>
    </clipPath>
  </defs>

  <style>
    .ai-orbit { transform-origin: 0 0; animation: ai-spin 18s linear infinite; }
    .ai-orbit-reverse { transform-origin: 0 0; animation: ai-spin-reverse 11s linear infinite; }
    .ai-bloom { transform-origin: 0 0; animation: ai-breathe 3.8s ease-in-out infinite; }
    .ai-flow { animation: ai-flow 6s linear infinite; }
    .ai-core { animation: ai-glow 3.8s ease-in-out infinite; }
    .ai-ray { animation: ai-ray 4.2s ease-in-out infinite; }
    @keyframes ai-spin { to { transform: rotate(360deg); } }
    @keyframes ai-spin-reverse { to { transform: rotate(-360deg); } }
    @keyframes ai-breathe {
      0%, 100% { transform: scale(0.96); }
      50% { transform: scale(1.035); }
    }
    @keyframes ai-flow { to { stroke-dashoffset: -72; } }
    @keyframes ai-glow {
      0%, 100% { opacity: 0.62; }
      50% { opacity: 1; }
    }
    @keyframes ai-ray {
      0%, 100% { opacity: 0.38; }
      42%, 68% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ai-orbit, .ai-orbit-reverse, .ai-bloom, .ai-flow, .ai-core, .ai-ray { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="#FFFFFF"/>
    <rect width="1200" height="340" fill="url(#grid)" opacity="0.48"/>
    <circle cx="970" cy="144" r="154" fill="url(#halo)"/>
  </g>

  <rect x="1" y="1" width="1198" height="338" rx="28" fill="none" stroke="#D0D7DE" stroke-width="2"/>
  <path d="M760 54V286" stroke="#DCE8DF" stroke-width="2"/>

  <!-- CUSTOMIZE: identity -->
  <circle cx="60" cy="56" r="5" fill="#2DA44E"/>
  <text x="77" y="61" fill="#216E39" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.6">WLYAAAAA / GITHUB</text>

  <text x="58" y="164" fill="#17201A" font-family="'Segoe UI','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="76" font-weight="720" letter-spacing="2">吴乐阳</text>
  <text x="62" y="209" fill="#57635A" font-family="'Segoe UI','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="23">写点代码，做点工具，也折腾 AI</text>

  <!-- CUSTOMIZE: interests -->
  <path d="M58 246H681" stroke="#C7D8CB" stroke-width="2"/>
  <path d="M58 246H184" stroke="url(#career)" stroke-width="4"/>
  <text x="58" y="286" fill="#216E39" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2">CODE · AI · TOOLS</text>

  <!-- REUSABLE: animated AI bloom -->
  <g transform="translate(970 144)">
    <circle r="96" fill="#FFFFFF" fill-opacity="0.7" stroke="#CDEBD5" stroke-width="2"/>
    <g class="ai-orbit">
      <circle r="80" fill="none" stroke="#9BE9A8" stroke-width="2" stroke-dasharray="5 13" class="ai-flow" opacity="0.92"/>
      <circle cx="80" cy="0" r="5" fill="#216E39"/>
      <circle cx="-40" cy="69.3" r="4" fill="#40C463"/>
      <circle cx="-40" cy="-69.3" r="3.5" fill="#9BE9A8"/>
    </g>
    <g class="ai-orbit-reverse">
      <circle r="62" fill="none" stroke="#40C463" stroke-width="3" stroke-dasharray="30 360" opacity="0.78"/>
      <circle cx="-62" cy="0" r="3.5" fill="#30A14E"/>
    </g>
    <g class="ai-bloom" fill="none" stroke="url(#core)" stroke-linecap="round">
      <path class="ai-ray" d="M0-23C-10-36-8-55 5-69" stroke-width="7" style="animation-delay:-0.0s"/>
      <path class="ai-ray" d="M0-23C-10-36-8-55 5-69" stroke-width="7" transform="rotate(60)" style="animation-delay:-0.7s"/>
      <path class="ai-ray" d="M0-23C-10-36-8-55 5-69" stroke-width="7" transform="rotate(120)" style="animation-delay:-1.4s"/>
      <path class="ai-ray" d="M0-23C-10-36-8-55 5-69" stroke-width="7" transform="rotate(180)" style="animation-delay:-2.1s"/>
      <path class="ai-ray" d="M0-23C-10-36-8-55 5-69" stroke-width="7" transform="rotate(240)" style="animation-delay:-2.8s"/>
      <path class="ai-ray" d="M0-23C-10-36-8-55 5-69" stroke-width="7" transform="rotate(300)" style="animation-delay:-3.5s"/>
    </g>
    <circle r="27" fill="#40C463" opacity="0.34" filter="url(#glow)" class="ai-core"/>
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="url(#core)"/>
    <circle r="7" fill="#FFFFFF" opacity="0.94"/>
  </g>
  <text x="970" y="274" text-anchor="middle" fill="#216E39" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.1">BUILDING FOR FUN</text>
</svg>
