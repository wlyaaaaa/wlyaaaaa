<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">吴乐阳的 GitHub 个人主页横幅</title>
  <desc id="desc">吴乐阳，2001年08月29日，Java Backend 转向 LLM Application Engineering。</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
