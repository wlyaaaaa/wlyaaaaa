      <stop offset="1" stop-color="#006D32"/>
    </linearGradient>
    <linearGradient id="career" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39D353"/>
      <stop offset="1" stop-color="#26A641"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22342A" stroke-width="1" opacity="0.8"/>
    </pattern>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="338" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
