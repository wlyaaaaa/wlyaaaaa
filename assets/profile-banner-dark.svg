    <path d="M838 205H1128" stroke="#F0F6FC" stroke-width="2" opacity="0.38"/>
    <text x="838" y="238" fill="#DCFCE7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="2.5" opacity="0.9">JAVA · LLM · SYSTEMS</text>
    <text x="1090" y="302" fill="#DCFCE7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="2" opacity="0.6">01</text>
